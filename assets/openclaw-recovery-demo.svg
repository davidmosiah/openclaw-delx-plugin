<svg width="1100" height="360" viewBox="0 0 1100 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Delx recovery workflow</title>
  <desc id="desc">OpenClaw calls the Delx recovery plugin, which keeps a session and returns recovery actions.</desc>
  <rect width="1100" height="360" rx="24" fill="#0F172A"/>
  <rect x="36" y="42" width="250" height="276" rx="18" fill="#172554" stroke="#60A5FA" stroke-width="2"/>
  <rect x="425" y="42" width="250" height="276" rx="18" fill="#312E81" stroke="#A78BFA" stroke-width="2"/>
  <rect x="814" y="42" width="250" height="276" rx="18" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="161" y="92" text-anchor="middle" fill="#DBEAFE" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">OpenClaw</text>
  <text x="161" y="134" text-anchor="middle" fill="#BFDBFE" font-family="Inter, Arial, sans-serif" font-size="18">agent incident</text>
  <text x="161" y="166" text-anchor="middle" fill="#BFDBFE" font-family="Inter, Arial, sans-serif" font-size="18">failure report</text>
  <text x="161" y="198" text-anchor="middle" fill="#BFDBFE" font-family="Inter, Arial, sans-serif" font-size="18">heartbeat</text>
  <text x="550" y="92" text-anchor="middle" fill="#EDE9FE" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Delx plugin</text>
  <text x="550" y="134" text-anchor="middle" fill="#DDD6FE" font-family="Inter, Arial, sans-serif" font-size="18">auto registration</text>
  <text x="550" y="166" text-anchor="middle" fill="#DDD6FE" font-family="Inter, Arial, sans-serif" font-size="18">session reuse</text>
  <text x="550" y="198" text-anchor="middle" fill="#DDD6FE" font-family="Inter, Arial, sans-serif" font-size="18">recovery tools</text>
  <text x="939" y="92" text-anchor="middle" fill="#D1FAE5" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Delx API</text>
  <text x="939" y="134" text-anchor="middle" fill="#A7F3D0" font-family="Inter, Arial, sans-serif" font-size="18">first safe action</text>
  <text x="939" y="166" text-anchor="middle" fill="#A7F3D0" font-family="Inter, Arial, sans-serif" font-size="18">outcome record</text>
  <text x="939" y="198" text-anchor="middle" fill="#A7F3D0" font-family="Inter, Arial, sans-serif" font-size="18">continuity</text>
  <path d="M306 180H405" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  <path d="M392 165L409 180L392 195" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M695 180H794" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  <path d="M781 165L798 180L781 195" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="292" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="18">Free reliability layer: recover, report, heartbeat, close session.</text>
</svg>
